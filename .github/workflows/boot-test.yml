name: Boot test (published ISO)

# Boots the ISO from the latest release in QEMU and adds the screenshots to that
# release. Runs on its own (about 10 minutes) whenever the tests change, or by hand.
on:
  push:
    branches: [main]
    paths: ["tests/**", ".github/workflows/boot-test.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boot-test
  cancel-in-progress: true

jobs:
  boot-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download the ISO from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . ./claudius.conf
          echo "TAG=v$CLAUDIUS_VERSION" >> "$GITHUB_ENV"
          mkdir -p out
          gh release download "v$CLAUDIUS_VERSION" --pattern '*.iso' --dir out
          ls -la out

      - name: Install QEMU and enable KVM
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 ovmf >/dev/null
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true

      - name: Boot test (BIOS 8 GB + UEFI 2 GB)
        id: boot
        continue-on-error: false
        run: bash tests/boot-test.sh out/*.iso out/screenshots

      - name: Attach screenshots to the release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls out/screenshots/*.png >/dev/null 2>&1 || { echo "no screenshots"; exit 0; }
          gh release upload "$TAG" out/screenshots/*.png --clobber
