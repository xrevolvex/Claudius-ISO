---
# Claudius installer: the "Users" page (your name, login name and password).
#
# Passwords: any password is accepted. Weak ones (short, or based on a
# dictionary word) show a warning, but you can carry on: the "Allow weak
# passwords" box is ticked for you, like on Ubuntu.
userGroup:       users
defaultGroups:
    - cdrom
    - floppy
    - sudo
    - audio
    - dip
    - video
    - plugdev
    - netdev
    - lpadmin
    - scanner
    - bluetooth
autologinGroup:  autologin
doAutologin:     false
sudoersGroup:    sudo

# Your own password is used for administrator tasks (sudo), no separate root password
setRootPassword: false
doReusePassword: false

allowWeakPasswords:        true
allowWeakPasswordsDefault: true

passwordRequirements:
    nonempty: true
    minLength: -1
    maxLength: -1
    libpwquality:
        - minlen=0
        - minclass=0

user:
    shell: /bin/bash
