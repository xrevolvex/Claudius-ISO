# Claudius login screen look
[greeter]
background=/usr/share/claudius/wallpapers/claudius-login.png
user-background=false
theme-name=Arc-Dark
icon-theme-name=Papirus-Dark
cursor-theme-name=DMZ-White
cursor-theme-size=24
font-name=Cantarell 11
xft-antialias=true
xft-hintstyle=hintslight
xft-rgba=rgb
default-user-image=/usr/share/claudius/logo/claudius-avatar.png
round-user-image=true
hide-user-image=false
indicators=~host;~spacer;~clock;~spacer;~session;~a11y;~power
clock-format=%A %d %B   %H:%M
position=50%,center 52%,center
screensaver-timeout=60
